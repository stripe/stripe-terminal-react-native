// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  ext {
    // Terminal Android SDK 6.0 (pulled in by @stripe/stripe-terminal-react-native
    // 0.0.1-beta.34) depends on Kotlin 2.3.21 libraries. React Native 0.83 defaults
    // to Kotlin Gradle Plugin 2.1.20, which cannot read that metadata. 2.2.0 can,
    // and is the newest the Expo 56 Pika compiler plugin ships. See the SDK README
    // ("Android" requirements) for details.
    kotlinVersion = "2.2.0"
  }
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
  }
}

def reactNativeAndroidDir = new File(
  providers.exec {
    workingDir(rootDir)
    commandLine("node", "--print", "require.resolve('react-native/package.json')")
  }.standardOutput.asText.get().trim(),
  "../android"
)

allprojects {
  repositories {
    maven {
      // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
      url(reactNativeAndroidDir)
    }

    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
