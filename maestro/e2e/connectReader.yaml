appId: ${APP_ID}
---
- tapOn:
    id: "discovery-method-button"
- tapOn:
    id: ${discoveryMethod}
- tapOn:
    id: "discover-readers-button"

# Wait until Discover Readers screen is visible before proceeding
- extendedWaitUntil:
    visible:
        id: "discovery-readers-screen"
    timeout: 20000

# Select test reader update type (when set)
- runFlow:
    when:
        true: ${updateType == "available" || updateType == "required" || updateType == "lowBattery" || updateType == "lowBatterySucceedConnect" || updateType == "random"}
    commands:
        - tapOn:
            id: "test-reader-update-button"
        - extendedWaitUntil:
            visible:
                id: "test-reader-update-screen"
            timeout: 10000
        - tapOn:
            id: "update-type-${updateType}"
        - tapOn:
            id: "test-reader-update-back"
        - extendedWaitUntil:
            visible:
                id: "discovery-readers-screen"
            timeout: 10000
        - runFlow:
            when:
                true: ${updateType == "required"}
            commands:
                # Confirm the selection reached the connection screen before
                # starting the one-shot required-update flow.
                - extendedWaitUntil:
                    visible: "Required \\(Config\\)"
                    timeout: 10000

- extendedWaitUntil:
    visible:
        id: "reader-0"
    timeout: 30000

- tapOn:
    id: "reader-0"
- runFlow:
    when:
        true: ${updateType == "required"}
    commands:
        # Reader activation and the update check can take longer than 16 seconds
        # on CI. Match the timeout used by the other connection-stage checks.
        - extendedWaitUntil:
            visible:
                id: "required-update-in-progress"
            timeout: 60000
